name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: broadcast
          POSTGRES_PASSWORD: broadcast
          POSTGRES_DB: broadcast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U broadcast -d broadcast_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TELEGRAM_BROADCAST_TEST_DSN: postgresql+asyncpg://broadcast:broadcast@localhost:5432/broadcast_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest
      - run: uv build
