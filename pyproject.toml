[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-broadcast"
version = "0.2.0"
description = "Durable async Telegram broadcasts with an owned SQLite database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0,<2.1", "aiogram>=3.20,<4", "aiosqlite>=0.21,<1", "filelock>=3.16,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff==0.15.7", "ty==0.0.73"]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_broadcast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
