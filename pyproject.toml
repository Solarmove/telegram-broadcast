[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-broadcast"
version = "0.1.0"
description = "Durable async Telegram broadcasts using your SQLAlchemy metadata and database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0,<2.1", "aiogram>=3.20,<4"]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "aiosqlite>=0.21,<1", "asyncpg>=0.30,<1", "ruff==0.15.7", "ty==0.0.73"]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_broadcast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = ["postgres: requires TELEGRAM_BROADCAST_TEST_DSN pointing to an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
